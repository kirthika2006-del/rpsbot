<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>RPSbot</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background: #1e1e2f;
        color: #fff;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
    }

    .chat-container {
        width: 400px;
        background: #2a2a40;
        border-radius: 12px;
        padding: 20px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }

    h2 {
        text-align: center;
        margin-top: 0;
    }

    .chat-box {
        height: 350px;
        overflow-y: auto;
        background: #1e1e2f;
        border-radius: 8px;
        padding: 10px;
        margin-bottom: 10px;
    }

    .message {
        padding: 8px 12px;
        border-radius: 8px;
        margin: 6px 0;
        max-width: 80%;
        word-wrap: break-word;
    }

    .user-message {
        background: #4e8cff;
        margin-left: auto;
        text-align: right;
    }

    .bot-message {
        background: #3a3a55;
        margin-right: auto;
    }

    .input-area {
        display: flex;
        gap: 8px;
    }

    input {
        flex: 1;
        padding: 10px;
        border-radius: 8px;
        border: none;
        outline: none;
    }

    button {
        padding: 10px 16px;
        border: none;
        border-radius: 8px;
        background: #4e8cff;
        color: #fff;
        cursor: pointer;
    }

    button:hover {
        background: #3a75e0;
    }
</style>
</head>
<body>

<div class="chat-container">
    <h2>🪨📄✂️ RPSbot</h2>
    <div class="chat-box" id="chatBox">
        <div class="message bot-message">Hi! Type rock, paper, or scissors to play with me!</div>
    </div>
    <div class="input-area">
        <input type="text" id="userInput" placeholder="Type rock / paper / scissors...">
        <button onclick="sendMessage()">Send</button>
    </div>
</div>

<script>
    const chatBox = document.getElementById("chatBox");
    const userInput = document.getElementById("userInput");

    userInput.addEventListener("keypress", function (e) {
        if (e.key === "Enter") {
            sendMessage();
        }
    });

    function addMessage(text, sender) {
        const msg = document.createElement("div");
        msg.classList.add("message", sender === "user" ? "user-message" : "bot-message");
        msg.textContent = text;
        chatBox.appendChild(msg);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    async function sendMessage() {
        const message = userInput.value.trim();
        if (!message) return;

        addMessage(message, "user");
        userInput.value = "";

        try {
            const response = await fetch("/chat", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ message: message })
            });

            const data = await response.json();
            addMessage(data.reply, "bot");
        } catch (error) {
            addMessage("Oops, something went wrong. Try again!", "bot");
        }
    }
</script>

</body>
</html>
